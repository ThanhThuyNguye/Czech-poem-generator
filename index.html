<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Czech Poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Czech Poem Generation</h1>
      </header>

      <main>
        <div class="form-container">
          <form id="poem-generator-form">
            <input
              type="text"
              placeholder="Enter the topic of the Czech poem"
              autofocus
              required
              autocomplete="off"
              class="instruction"
              id="user-instructions"
            />
            <input type="submit" value="Submit" class="submit-button" />
          </form>
          <div class="hint"> i.e: Flower, Prague or Cheese </div>
        </div>

        <div class="poem hidden" id="poem"></div>
      </main>

      <footer>
        This AI project was coded by
        <a href="https://github.com/ThanhThuyNguye" target="_blank"
          >Thanh Thuy Nguyen</a
        >
        and is
        <a
          href="https://github.com/ThanhThuyNguye/Czech-poem-generator"
          target="_blank"
          >open-sourced on Github</a
        >
        and is hosted on
        <a href="https://czech-poem-generator.onrender.com" target="_blank"
          >Render</a
        >
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
